[platformio]
default_envs = esp32p4

[env:esp32p4]
board = esp32-p4-evboard
platform = https://github.com/pioarduino/platform-espressif32/releases/download/61.04.00/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions-p4.csv

build_unflags =
    -Os
    -fno-lto
;   -D ARDUINO_USB_CDC_ON_BOOT=1

build_flags =
  -Isrc/
  -Isrc/config/
  -std=gnu++20
  -DCORE_DEBUG_LEVEL=3
  ; -DCORE_DEBUG_LEVEL=0
  -D CONFIG_SPIRAM_SUPPORT=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  -O2

check_skip_packages = yes
check_tool = cppcheck
check_flags = 
    --enable=all 
    --inconclusive 
    --suppress=badBitmaskCheck 
    --suppress=missingIncludeSystem
    --suppress=missingInclude
    --suppress=unusedFunction
    --suppress=*:*src/config/*
check_severity = low, medium, high

extra_scripts = 
  pre:../../scripts/link_lib.py
  post:../../scripts/enable_lto.py

; debug_tool = esp-builtin
; upload_protocol = esp-builtin
; debug_init_break = tbreak setup
