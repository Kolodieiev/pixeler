[platformio]
default_envs = esp32

[env:esp32]
board = esp32dev
board_build.partitions = partitions.csv
platform = https://github.com/pioarduino/platform-espressif32/releases/download/61.04.00/platform-espressif32.zip
framework = arduino
monitor_speed = 115200

build_unflags =
  -Os
  fno-lto

build_flags =
  -Isrc/
  -Isrc/config/
  -std=gnu++20
  ; -DCORE_DEBUG_LEVEL=3
  -DCORE_DEBUG_LEVEL=0
  
check_skip_packages = yes
check_tool = cppcheck
check_flags = 
    --enable=all 
    --inconclusive 
    --suppress=badBitmaskCheck 
    --suppress=missingIncludeSystem
    --suppress=missingInclude
    --suppress=unusedFunction
    --suppress=*:*src/config/*
check_severity = low, medium, high

extra_scripts = 
  pre:../../scripts/link_lib.py
  post:../../scripts/enable_lto.py
