[platformio]
default_envs = esp32s3

; ESP32 S3 environment
[env:esp32s3]
board = lilka_v2
platform = https://github.com/pioarduino/platform-espressif32/releases/download/61.04.00/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions-s3.csv

build_unflags =
  -Os
  -fno-lto
; -D ARDUINO_USB_CDC_ON_BOOT=1

build_flags =
  -Imock/
  -std=gnu++20
  -DCORE_DEBUG_LEVEL=3
; -DCORE_DEBUG_LEVEL=0
  -D CONFIG_SPIRAM_SUPPORT=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  -O2

check_skip_packages = yes
check_tool = cppcheck
check_flags = 
  --enable=all 
  --inconclusive 
  --suppress=badBitmaskCheck 
  --suppress=missingIncludeSystem
  --suppress=missingInclude
  --suppress=unusedFunction
  --suppress=*:*src/pixeler/src/driver/graphics/*
  --suppress=*:*src/config/*
  --suppress=*:*src/pixeler/lib/lua/*
check_severity = low, medium, high

; debug_tool = esp-builtin
; upload_protocol = esp-builtin
; debug_init_break = tbreak setup


